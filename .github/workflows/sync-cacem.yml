name: Sync CACEM Cannes snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_cacem.py'
      - '.github/workflows/sync-cacem.yml'

permissions:
  contents: write

concurrency:
  group: cacem-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin
      - name: Download and clip national CACEM layer to Cannes
        run: python scripts/sync_cacem.py
      - name: Commit refreshed CACEM snapshot
        run: |
          if git diff --quiet -- data; then
            echo "No CACEM changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh CACEM Cannes snapshot"
          git push
