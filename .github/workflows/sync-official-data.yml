name: Sync official maritime data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_official_data.py'
      - '.github/workflows/sync-official-data.yml'

permissions:
  contents: write

concurrency:
  group: marine-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh AVURNAV, SHOM and Copernicus STAC
        run: python scripts/sync_official_data.py
      - name: Commit refreshed snapshots
        run: |
          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh official maritime data"
          git push
