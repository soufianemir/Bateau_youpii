name: Validate PWA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript and Python syntax
        run: |
          node --check app.js
          node --check runtime-data.js
          node --check sw.js
          python -m py_compile scripts/sync_official_data.py scripts/sync_cacem.py
      - name: Validate PWA files and local references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          required = [
              'index.html', 'app.js', 'runtime-data.js', 'styles.css', 'sw.js',
              'manifest.webmanifest', 'assets/icon.svg',
              'data/avurnav.json', 'data/shom-achare.geojson', 'data/shom-resare.geojson',
              'data/shom-fairwy.geojson', 'data/shom-seabed.geojson', 'data/cacem-cannes.geojson',
              'data/sentinel-latest.json', 'data/source-status.json'
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')

          manifest = json.loads(Path('manifest.webmanifest').read_text())
          for icon in manifest.get('icons', []):
              path = icon['src'].removeprefix('./')
              if not Path(path).exists():
                  raise SystemExit(f'Missing manifest icon: {path}')

          for path in Path('data').glob('*'):
              if path.suffix in {'.json', '.geojson'}:
                  json.loads(path.read_text(encoding='utf-8'))

          html = Path('index.html').read_text()
          refs = re.findall(r'(?:href|src)="(\./[^\"]+)"', html)
          for ref in refs:
              path = ref.removeprefix('./')
              if not Path(path).exists():
                  raise SystemExit(f'Missing local HTML reference: {path}')

          sw = Path('sw.js').read_text()
          for ref in re.findall(r"'\./([^']+)'", sw):
              if ref == '' or ref.endswith('/'):
                  continue
              if not Path(ref).exists():
                  raise SystemExit(f'Missing service-worker asset: {ref}')

          print('PWA + official-data validation OK')
          PY
